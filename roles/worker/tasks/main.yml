- name: Extract worker.tar directly to the remote server
  unarchive:
    src: worker.tar
    dest: /opt
    creates: /opt/worker/pom.xml

- name: Add Debian Bullseye repository for openjdk-11-jdk compatibility
  apt_repository:
    repo: "deb http://deb.debian.org/debian bullseye main"
    state: present
    update_cache: yes

- name: download maven and java
  apt:
    name: [ "maven", "openjdk-11-jdk" ]
    state: present
    update_cache: yes

- name: compile worker
  ansible.builtin.command: mvn package
  args:
    chdir: /opt/worker
    creates: /opt/worker/target/worker-jar-with-dependencies.jar
    
- name: Copy systemd service file for worker
  template:
    src: "{{ role_path }}/files/worker.service"
    dest: /etc/systemd/system/worker.service
  notify: restart worker

- name: Start and enable worker service
  systemd:
    name: worker
    state: started
    enabled: yes