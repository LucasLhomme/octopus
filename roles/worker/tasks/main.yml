- name: Upload worker.tar to the remote server
  copy:
    src: worker.tar
    dest: /tmp/worker.tar

#pourquoi ici j'utilise command au lieu de unarchive?
# j'utilise command au lieu de unarchive car sans ça, unarchive me return un skipped au lieu d'un OK
- name: Extract worker.tar directly to the remote server
  command: tar -xf /tmp/worker.tar -C /opt
  args:
    creates: /opt/worker/pom.xml

- name: download maven and java
  apt:
    name: [ "maven", "openjdk-21-jdk" ]
    state: present
    update_cache: yes

- name: compile worker
  ansible.builtin.command: mvn package -DskipTests
  args:
    chdir: /opt/worker
    creates: /opt/worker/target/worker-jar-with-dependencies.jar

- name: Copy systemd service file for worker
  template:
    src: "{{ role_path }}/files/worker.service"
    dest: /etc/systemd/system/worker.service
  notify: restart worker

- name: Start and enable worker service
  systemd:
    name: worker
    state: started
    enabled: yes
    daemon_reload: yes