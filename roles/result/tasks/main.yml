- name: Upload result.tar to the remote server
  copy:
    src: result.tar
    dest: /tmp/result.tar

#pourquoi ici j'utilise command au lieu de unarchive?
# j'utilise command au lieu de unarchive car sans ça, unarchive me return un skipped au lieu d'un OK
- name: Extract result.tar directly to the remote server
  command: tar -xf /tmp/result.tar -C /opt
  args:
    creates: /opt/result/package.json

- name: download npm and nodejs
  apt:
    name: [ "nodejs", "npm" ]
    state: present
    update_cache: yes

- name: install npm dependencies
  npm:
    path: "/opt/result"
    state: present

- name: Copy systemd service file for Result
  template:
    src: "{{ role_path }}/files/result.service"
    dest: /etc/systemd/system/result.service
  notify: restart result

- name: Start and enable Result service
  systemd:
    name: result
    state: started
    enabled: yes
    daemon_reload: yes