- name: Extract result.tar directly to the remote server
  unarchive:
    src: result.tar
    dest: /opt
    creates: /opt/result/package.json

- name: download npm and nodejs
  apt:
    name: [ "nodejs", "npm" ]
    state: present
    update_cache: yes
    
- name: Upgrade pg driver version in package.json to pg@8 to prevent hanging on Node 18+
  lineinfile:
    path: /opt/result/package.json
    search_string: '"pg": "^4.4.3"'
    line: '    "pg": "^8.11.0",'

- name: install npm dependencies
  npm:
    path: "/opt/result"
    state: present

- name: Add pg.connect support to server.js
  lineinfile:
    path: /opt/result/server.js
    insertbefore: BOF
    line: 'require("pg").connect = function(c,cb){ if(!this.p)this.p=new this.Pool({connectionString:c}); this.p.connect(cb); };'

- name: Copy systemd service file for Result
  template:
    src: "{{ role_path }}/files/result.service"
    dest: /etc/systemd/system/result.service
  notify: restart result

- name: Start and enable Result service
  systemd:
    name: result
    state: started
    enabled: yes