- name: Extract result.tar directly to the remote server
  unarchive:
    src: result.tar
    dest: /opt
    creates: /opt/result/package.json

- name: download npm and nodejs
  apt:
    name: [ "nodejs", "npm" ]
    state: present
    update_cache: yes
    
- name: Upgrade pg driver version in package.json to pg@8 to prevent hanging on Node 18+
  lineinfile:
    path: /opt/result/package.json
    search_string: '"pg": "^4.4.3"'
    line: '    "pg": "^8.11.0",'

- name: install npm dependencies
  npm:
    path: "/opt/result"
    state: present

- name: Add shim to support legacy pg.connect in modern pg@8
  blockinfile:
    path: /opt/result/server.js
    insertbefore: BOF
    marker: "// {mark} ANSIBLE MANAGED BLOCK"
    block: |
      // Shim to support legacy pg.connect in modern pg@8
      var pg_orig = require('pg');
      var pool_shim = new pg_orig.Pool({
        connectionString: "postgres://" + process.env['POSTGRESQL_USER'] + ':' + process.env['POSTGRESQL_PASSWORD'] + "@" + process.env['POSTGRESQL_HOST'] + ':' + process.env['POSTGRESQL_PORT'] + '/' + process.env['POSTGRESQL_DB']
      });
      pg_orig.connect = function(uri, callback) {
        pool_shim.connect(callback);
      };

- name: Copy systemd service file for Result
  template:
    src: "{{ role_path }}/files/result.service"
    dest: /etc/systemd/system/result.service
  notify: restart result

- name: Start and enable Result service
  systemd:
    name: result
    state: started
    enabled: yes