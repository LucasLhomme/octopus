- name: Upload poll.tar to the remote server
  copy:
    src: poll.tar
    dest: /tmp/poll.tar

#pourquoi ici j'utilise command au lieu de unarchive?
# j'utilise command au lieu de unarchive car sans ça, unarchive me return un skipped au lieu d'un OK
- name: Extract poll.tar directly to the remote server
  command: tar -xf /tmp/poll.tar -C /opt
  args:
    creates: /opt/poll/app.py

- name: Install Python application dependencies
  pip:
    requirements: /opt/poll/requirements.txt
    extra_args: --break-system-packages

- name: Copy systemd service file for Poll
  template:
    src: "{{ role_path }}/files/poll.service"
    dest: /etc/systemd/system/poll.service
  notify: restart poll

- name: Start and enable Poll service
  systemd:
    name: poll
    state: started
    enabled: yes
    daemon_reload: yes

