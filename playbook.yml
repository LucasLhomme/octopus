- name: Deploy Octopus Stack
  hosts: all
  become: yes
  roles:
    - base

- name: Setup Redis
  hosts: redis
  become: yes
  roles:
    - redis

- name: Setup PostgreSQL
  hosts: postgresql
  become: yes
  roles:
    - postgresql

- name: Setup Poll Application
  hosts: poll
  become: yes
  roles:
    - poll

- name: Setup Result Application
  hosts: result
  become: yes
  roles:
    - result

- name: Setup Worker Application
  hosts: worker
  become: yes
  roles:
    - worker
