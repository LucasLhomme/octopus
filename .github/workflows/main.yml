name: Ansible Playbook CI

on:
  push:
  workflow_dispatch:

jobs:
  check-playbook:
    if: github.repository != 'EpitechPGE2-2025/G-DOP-400-LIL-4-1-octopus-2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Verify required files architecture
        run: |
          echo "🔍 Vérification de la présence des fichiers requis par le sujet..."
          required_files=(
            "playbook.yml"
            "poll.tar"
            "result.tar"
            "worker.tar"
            "group_vars/all.yml"
            "roles/base/tasks/main.yml"
            "roles/postgresql/files/pg_hba.conf"
            "roles/postgresql/files/schema.sql"
            "roles/postgresql/tasks/main.yml"
            "roles/redis/files/redis.conf"
            "roles/redis/tasks/main.yml"
            "roles/poll/files/poll.service"
            "roles/poll/tasks/main.yml"
            "roles/result/files/result.service"
            "roles/result/tasks/main.yml"
            "roles/worker/files/worker.service"
            "roles/worker/tasks/main.yml"
          )
          errors=0
          for file in "${required_files[@]}"; do
            if [ -f "$file" ]; then
              echo "✅ Fichier présent : $file"
            else
              echo "❌ Fichier MANQUANT : $file"
              errors=$((errors+1))
            fi
          done
          if [ $errors -ne 0 ]; then
            echo "❌ Échec de la vérification : $errors fichiers requis manquants !"
            exit 1
          fi
          echo "🎉 Tous les fichiers requis sont présents et respectent l'architecture !"

      - name: Verify that group_vars/all.yml is Vault-encrypted
        run: |
          echo "🔍 Vérification du chiffrement d'Ansible Vault..."
          if grep -q "\$ANSIBLE_VAULT;" group_vars/all.yml; then
            echo "✅ group_vars/all.yml est correctement chiffré par Ansible Vault."
          else
            echo "❌ ERROR: group_vars/all.yml n'est PAS chiffré ! Risque de sécurité majeur !"
            exit 1
          fi

      - name: Check playbook syntax
        run: |
          export ANSIBLE_VAULT_PASSWORD_FILE=/tmp/.vault_pass
          echo "verySecretPassword" > /tmp/.vault_pass
          ansible-playbook -i production --syntax-check playbook.yml

  functional-test-docker:
    if: github.repository != 'EpitechPGE2-2025/G-DOP-400-LIL-4-1-octopus-2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Create Docker Network
        run: docker network create octopus_net

      - name: Start Systemd-enabled Containers
        run: |
          docker run -d --name redis --privileged -v /sys/fs/cgroup:/sys/fs/cgroup:rw --network octopus_net jrei/systemd-debian:11
          docker run -d --name postgresql --privileged -v /sys/fs/cgroup:/sys/fs/cgroup:rw --network octopus_net jrei/systemd-debian:11
          docker run -d --name poll --privileged -v /sys/fs/cgroup:/sys/fs/cgroup:rw -p 8080:80 --network octopus_net jrei/systemd-debian:11
          docker run -d --name result --privileged -v /sys/fs/cgroup:/sys/fs/cgroup:rw -p 8081:80 --network octopus_net jrei/systemd-debian:11
          docker run -d --name worker --privileged -v /sys/fs/cgroup:/sys/fs/cgroup:rw --network octopus_net jrei/systemd-debian:11

      - name: Prepare Containers (Install Python 3, ca-certificates, curl, apt-utils, sudo)
        run: |
          echo "Installing prerequisites on all containers..."
          for container in redis postgresql poll result worker; do
            docker exec $container apt-get update
            docker exec $container apt-get install -y python3 python3-apt apt-utils sudo ca-certificates curl
          done

      - name: Create Ansible Inventory for Docker
        run: |
          cat <<EOF > inventory_docker.ini
          [all:vars]
          ansible_connection=docker
          ansible_user=root

          [redis]
          redis

          [postgresql]
          postgresql

          [poll]
          poll

          [result]
          result

          [worker]
          worker
          EOF

      - name: Run Ansible Playbook (First Run - Install)
        run: |
          export ANSIBLE_VAULT_PASSWORD_FILE=/tmp/.vault_pass
          echo "verySecretPassword" > /tmp/.vault_pass
          
          # Run the playbook targeting the Docker containers
          ansible-playbook -i inventory_docker.ini playbook.yml \
            --extra-vars "postgres_host=postgresql redis_host=redis"

      - name: Test Idempotency (Second Run)
        run: |
          export ANSIBLE_VAULT_PASSWORD_FILE=/tmp/.vault_pass
          echo "verySecretPassword" > /tmp/.vault_pass
          
          # Second pass should not make any modifications (changed=0)
          ansible-playbook -i inventory_docker.ini playbook.yml \
            --extra-vars "postgres_host=postgresql redis_host=redis" > /tmp/ansible_second_run.log
          
          cat /tmp/ansible_second_run.log
          
          # Verify that changed counts are 0
          if grep -q -E "changed=[1-9]" /tmp/ansible_second_run.log; then
            echo "❌ ERROR: Idempotency failed. 'changed' counts are not 0 on second run."
            exit 1
          fi
          echo "✅ Idempotency test successful!"

      - name: Verify Web Services Health
        run: |
          echo "Waiting 5 seconds for services to settle..."
          sleep 5
          
          echo "Checking Poll application (Port 8080)..."
          curl -sI http://localhost:8080 | grep "200" || (echo "❌ Poll application is not running properly" && exit 1)
          
          echo "Checking Result application (Port 8081)..."
          curl -sI http://localhost:8081 | grep "200" || (echo "❌ Result application is not running properly" && exit 1)
          
          echo "🎉 All services are active and fully operational !"
